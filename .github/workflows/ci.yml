name: mew continuous integration checks

on:
  push:
    branches: [master]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint · prek + ty
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Run linters, formatter and type checker
        run: uvx prek run --all-files --show-diff-on-failure

      - name: Type check the codebase
        run: uv run --all-extras --group test --group typing ty check

  test:
    name: ${{ matrix.os }} · py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install project and its dependencies
        run: uv sync --all-extras --group test

      - name: Run tests
        run: uv run pytest -n auto

  free-threaded:
    name: free-threaded · py3.14t
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.14t"
          enable-cache: true

      # duckdb has no 3.14t wheel yet.
      - name: Install project and its dependencies
        run: uv sync --all-extras --group test --no-install-package duckdb

      - name: Assert the GIL stays disabled after import
        run: |
          uv run --no-sync python - <<'PY'
          import sys
          assert not sys._is_gil_enabled(), "interpreter is not free-threaded"
          import mew._core  # FREE_THREADED build must not re-enable the GIL
          assert not sys._is_gil_enabled(), "importing mew._core re-enabled the GIL"
          print("OK: GIL disabled after `import mew._core`")
          PY

      - name: Run tests
        run: uv run --no-sync pytest -n auto

  docs:
    name: docs · sphinx
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install project and docs dependencies
        run: uv sync --all-extras --group docs

      - name: Build docs (warnings = errors)
        run: uv run sphinx-build -W --keep-going -b html docs docs/_build/html

      - name: Run doctests
        run: uv run sphinx-build -b doctest docs docs/_build/doctest

      - name: Check links
        run: uv run sphinx-build -b linkcheck docs docs/_build/linkcheck
        continue-on-error: true
