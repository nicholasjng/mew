name: mew continuous integration checks

on:
  push:
    branches: [master]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint · prek + ty
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"

      - name: Install project and its dependencies
        run: uv sync --all-extras --group test --group docs

      - name: Run linters, formatter and type checker
        run: uvx prek run --all-files --show-diff-on-failure

      - name: Check generated native stub
        run: |
          uv run --no-sync python scripts/configure-clangd.py
          cmake --build build/clangd --target check_mew_core_stub

  test:
    name: ${{ matrix.os }} · py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    # A threading regression hangs rather than fails; jobs take about 2 minutes.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # Every version on Linux; macOS and Windows test the oldest and the newest,
      # which keeps the run within the runners' concurrency limit.
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          - { os: macos-latest, python-version: "3.11" }
          - { os: macos-latest, python-version: "3.15" }
          - { os: windows-latest, python-version: "3.11" }
          - { os: windows-latest, python-version: "3.15" }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project and its dependencies
        run: uv sync --all-extras --group test --group duckdb

      - name: Run tests
        run: uv run --no-sync pytest -n auto

  free-threaded:
    name: free-threaded · py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14t", "3.15t"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}

      # The optional DuckDB integration group is only installed on GIL builds.
      - name: Install project and its dependencies
        run: uv sync --all-extras --group test

      - name: Assert the GIL stays disabled after import
        run: |
          uv run --no-sync python - <<'PY'
          import sys
          assert not sys._is_gil_enabled(), "interpreter is not free-threaded"
          import mew._core
          assert not sys._is_gil_enabled(), "importing mew._core re-enabled the GIL"
          print("OK: GIL disabled after `import mew._core`")
          PY

      - name: Run tests
        run: uv run --no-sync pytest -n auto

  docs:
    name: docs · sphinx
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"

      - name: Install project and docs dependencies
        run: uv sync --all-extras --group docs

      - name: Build docs (warnings = errors)
        run: uv run sphinx-build -W --keep-going -b html docs docs/_build/html
