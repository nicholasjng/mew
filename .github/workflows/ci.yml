name: mew continuous integration checks

on:
  push:
    branches: [master]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint · prek + ty
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Run linters, formatter and type checker
        run: uvx prek run --all-files --show-diff-on-failure

      - name: Type check the codebase
        run: uv run --all-extras --group test --group typing ty check

  test:
    name: ${{ matrix.os }} · py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install project and its dependencies
        run: uv sync --all-extras --group test

      - name: Run tests
        run: uv run pytest

  free-threaded:
    name: free-threaded · py3.13t
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.13t"
          enable-cache: true

      # The result-path deps (pyarrow, duckdb, memray, pyinstrument) don't
      # publish 3.13t wheels yet, so this installs only the build group needed to
      # compile and import the extension. Grow the test subset below as upstream
      # free-threaded wheels appear.
      - name: Build mew on the free-threaded interpreter
        run: uv sync

      - name: Assert the GIL stays disabled after import
        run: |
          uv run --no-sync python - <<'PY'
          import sys
          assert not sys._is_gil_enabled(), "interpreter is not free-threaded"
          import mew._core  # FREE_THREADED build must not re-enable the GIL
          assert not sys._is_gil_enabled(), "importing mew._core re-enabled the GIL"
          print("OK: GIL disabled after `import mew._core`")
          PY

      # Dependency-light subset: core registration, running (including the
      # threaded-mode guard), reporting, and session identity. Tests needing
      # pyarrow/duckdb skip cleanly via importorskip.
      - name: Run the dependency-light test subset
        run: |
          uv run --no-sync --with pytest python -m pytest -q \
            tests/test_api.py tests/test_registry.py tests/test_runner.py \
            tests/test_reporter.py tests/test_context.py tests/test_config.py \
            tests/test_discovery.py tests/test_regressions.py tests/test_session.py

  docs:
    name: docs · sphinx
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install project and docs dependencies
        run: uv sync --all-extras --group docs

      - name: Build docs (warnings = errors)
        run: uv run sphinx-build -W --keep-going -b html docs docs/_build/html

      - name: Run doctests
        run: uv run sphinx-build -b doctest docs docs/_build/doctest

      - name: Check links
        run: uv run sphinx-build -b linkcheck docs docs/_build/linkcheck
        continue-on-error: true
