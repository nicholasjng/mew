name: mew continuous integration checks

on:
  push:
    branches: [master]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint · prek + ty
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"

      - name: Install project and its dependencies
        run: uv sync --all-extras --all-groups

      - name: Run linters, formatter and type checker
        run: uvx prek run --all-files --show-diff-on-failure

      - name: Check generated native stub
        run: |
          uv run --no-sync python scripts/configure-clangd.py
          cmake --build build/clangd --target check_mew_core_stub

  test:
    name: ${{ matrix.os }} · py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    # A threading regression hangs rather than fails; jobs take about 2 minutes.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project and its dependencies
        run: uv sync --all-extras --group test

      - name: Run tests
        run: uv run pytest -n auto

  free-threaded:
    name: free-threaded · py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14t", "3.15t"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}

      # duckdb has no free-threaded wheels yet.
      - name: Install project and its dependencies
        run: uv sync --all-extras --group test --no-install-package duckdb

      - name: Assert the GIL stays disabled after import
        run: |
          uv run --no-sync python - <<'PY'
          import sys
          assert not sys._is_gil_enabled(), "interpreter is not free-threaded"
          import mew._core
          assert not sys._is_gil_enabled(), "importing mew._core re-enabled the GIL"
          print("OK: GIL disabled after `import mew._core`")
          PY

      - name: Run tests
        run: uv run --no-sync pytest -n auto

  asan:
    name: asan · ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"

      - name: Build the ASAN editable install
        env:
          CC: gcc
          CXX: g++
        run: MEW_ASAN=1 uv sync --all-groups --reinstall-package=mew-bench

      # libstdc++ must be preloaded alongside libasan.
      - name: Run tests under AddressSanitizer
        run: |
          LD_PRELOAD="$(gcc -print-file-name=libasan.so) $(gcc -print-file-name=libstdc++.so)" \
          ASAN_OPTIONS="detect_leaks=0:halt_on_error=1" \
            .venv/bin/python -m pytest --capture no

  docs:
    name: docs · sphinx
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"

      - name: Install project and docs dependencies
        run: uv sync --all-extras --group docs

      - name: Build docs (warnings = errors)
        run: uv run sphinx-build -W --keep-going -b html docs docs/_build/html
