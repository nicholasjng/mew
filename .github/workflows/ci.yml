name: mew continuous integration checks

on:
  push:
    branches: [master]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint · prek + ty
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Run linters, formatter and type checker
        run: uvx prek run --all-files --show-diff-on-failure

      - name: Type check the codebase
        run: uv run --all-extras --group test --group typing ty check src/mew/ tests/

  test:
    name: ${{ matrix.os }} · py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install project and its dependencies
        run: uv sync --all-extras --group test

      - name: Run tests
        run: uv run pytest

  docs:
    name: docs · sphinx
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install project and docs dependencies
        run: uv sync --all-extras --group docs

      - name: Build docs (warnings = errors)
        run: uv run sphinx-build -W --keep-going -b html docs docs/_build/html

      - name: Run doctests
        run: uv run sphinx-build -b doctest docs docs/_build/doctest

      - name: Check links
        run: uv run sphinx-build -b linkcheck docs docs/_build/linkcheck
        continue-on-error: true
