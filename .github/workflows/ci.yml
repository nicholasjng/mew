name: mew continuous integration checks

on:
  push:
    branches: [master]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint · prek + ty
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install project and its dependencies
        run: uv sync --all-extras --all-groups

      - name: Run linters, formatter and type checker
        run: uvx prek run --all-files --show-diff-on-failure

  test:
    name: ${{ matrix.os }} · py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install project and its dependencies
        run: uv sync --all-extras --group test

      - name: Run tests
        run: uv run pytest -n auto

  free-threaded:
    name: free-threaded · py3.14t
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14t"
          enable-cache: true

      # duckdb has no 3.14t wheel yet.
      - name: Install project and its dependencies
        run: uv sync --all-extras --group test --no-install-package duckdb

      - name: Assert the GIL stays disabled after import
        run: |
          uv run --no-sync python - <<'PY'
          import sys
          assert not sys._is_gil_enabled(), "interpreter is not free-threaded"
          import mew._core  # FREE_THREADED build must not re-enable the GIL
          assert not sys._is_gil_enabled(), "importing mew._core re-enabled the GIL"
          print("OK: GIL disabled after `import mew._core`")
          PY

      - name: Run tests
        run: uv run --no-sync pytest -n auto

  asan:
    name: asan · ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Build the ASAN editable install
        env:
          CC: gcc
          CXX: g++
        run: MEW_ASAN=1 uv sync --all-groups --reinstall-package=mew

      # libstdc++ must be preloaded alongside libasan.
      - name: Run tests under AddressSanitizer
        run: |
          LD_PRELOAD="$(gcc -print-file-name=libasan.so) $(gcc -print-file-name=libstdc++.so)" \
          ASAN_OPTIONS="detect_leaks=0:halt_on_error=1" \
            uv run --no-sync --all-groups pytest --capture no

  tsan:
    name: tsan · free-threaded py3.14t
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.14t"
          enable-cache: true

      - name: Build the TSAN editable install
        env:
          CC: gcc
          CXX: g++
        run: >
          MEW_TSAN=1 uv sync --python 3.14t --all-extras --all-groups
          --no-install-package duckdb --reinstall-package=mew

      - name: Assert the GIL stays disabled after import
        run: |
          uv run --no-sync python - <<'PY'
          import sys
          assert not sys._is_gil_enabled(), "interpreter is not free-threaded"
          PY

      # Disable deadlock detection, since CPython alone holds more locks
      # than the maximum amount supported by TSAN.
      - name: Run tests under ThreadSanitizer
        run: |
          LD_PRELOAD="$(gcc -print-file-name=libtsan.so) $(gcc -print-file-name=libstdc++.so)" \
          TSAN_OPTIONS="halt_on_error=1:detect_deadlocks=0" \
            uv run --no-sync --all-extras --all-groups pytest --capture no

  docs:
    name: docs · sphinx
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install project and docs dependencies
        run: uv sync --all-extras --group docs

      - name: Build docs (warnings = errors)
        run: uv run sphinx-build -W --keep-going -b html docs docs/_build/html

      - name: Run doctests
        run: uv run sphinx-build -b doctest docs docs/_build/doctest

      - name: Check links
        run: uv run sphinx-build -b linkcheck docs docs/_build/linkcheck
        continue-on-error: true
