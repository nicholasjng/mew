name: Build wheels and upload to PyPI on release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - src/**
      - patches/**
      - cmake/**
      - tests/smoke_wheel.py
      - pyproject.toml
      - CMakeLists.txt
      - .github/workflows/release.yml
  release:
    types: [published]

permissions: {}

jobs:
  wheels:
    name: wheels · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: false

      - uses: pypa/cibuildwheel@v4.3.5

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
          enable-cache: false

      - run: uv build
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: publish · pypi
    needs: [wheels, sdist]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Assert every artifact matches the release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          for f in dist/*; do
            case "${f##*/}" in
              mew_bench-"${TAG#v}"-*.whl | mew_bench-"${TAG#v}".tar.gz) ;;
              *) echo "::error::${f##*/} is not version ${TAG#v}"; exit 1 ;;
            esac
          done
      - uses: pypa/gh-action-pypi-publish@v1.14.3
