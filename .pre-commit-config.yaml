exclude: ^patches/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --no-sync ruff check --fix --exit-non-zero-on-fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run --no-sync ruff format
        language: system
        types_or: [python, pyi]
      - id: ty-check
        name: ty check
        entry: uv run --no-sync ty check
        language: system
        types_or: [python, pyi]
        pass_filenames: false
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.5
    hooks:
      - id: clang-format
        types_or: [c, c++]
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: "0.13.7"
    hooks:
      - id: uv-lock
  - repo: https://github.com/woodruffw/zizmor-pre-commit
    rev: v1.32.0
    hooks:
      - id: zizmor
        args: [--fix, --min-severity=medium]
