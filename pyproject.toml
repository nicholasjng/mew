[build-system]
requires = ["scikit-build-core >=0.10", "nanobind >=2.10"]
build-backend = "scikit_build_core.build"

[project]
name = "mew"
version = "0.1.0"
description = "A CLI for microbenchmarking Python code snippets."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Nicholas Junge", email = "nicho.junge@gmail.com" }]
dependencies = []

[project.urls]
Documentation = "https://mew.readthedocs.io"
Repository = "https://github.com/nicholasjng/mew"
Issues = "https://github.com/nicholasjng/mew/issues"
Changelog = "https://mew.readthedocs.io/en/latest/changelog.html"

[project.optional-dependencies]
cpu = [ "pyinstrument >=4.6" ]
memory = [ "memray>=1.5; sys_platform != 'win32'" ]

[dependency-groups]
build = [
    "nanobind>=2.13.0",
    "ruff>=0.15.12",  # for CMake's post-build stub formatting step.
    "scikit-build-core >=0.10",
]
docs = [
    "sphinx >=8",
    "furo >=2024.8",
    "myst-parser >=4",
    "sphinx-design >=0.6",
    "sphinx-copybutton >=0.5",
    "sphinx-autodoc-typehints >=2.4",
]
test = [
    "duckdb >=1.1",
    "numpy>=2.4.6",
    "pytest >=8",
]
typing = [ "ty>=0.0.42" ]  # used in GitHub Actions only.

[tool.uv]
# Build mew against the project .venv so includes from Python packages
# (nanobind etc.) in compile_commands.json survive across rebuilds.
no-build-isolation-package = ["mew"]
# exclude dependency versions newer than one week
exclude-newer = "1 week"
exclude-newer-package = { nanobind = false }
# Require the "build" group due to no build isolation
default-groups = ["build"]

[project.scripts]
mew = "mew.cli:main"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/mew"]
wheel.py-api = "cp312"
cmake.version = ">=3.21"
cmake.build-type = "Release"

[tool.scikit-build.cmake.define]
BENCHMARK_ENABLE_TESTING = "OFF"
BENCHMARK_ENABLE_GTEST_TESTS = "OFF"
BENCHMARK_ENABLE_INSTALL = "OFF"
CMAKE_EXPORT_COMPILE_COMMANDS = "ON"

[[tool.scikit-build.overrides]]
# Free-threaded interpreters (abi flag "t") can't use the stable ABI, so the
# `cp312` abi3 tag above is invalid there: clear py-api for a version-specific
# free-threaded wheel.
if.abi-flags = "t"
wheel.py-api = ""

[[tool.scikit-build.overrides]]
if.env.MEW_ASAN = "1"
build-dir = "build/asan"
cmake.build-type = "Debug"
cmake.args = ["-DMEW_ASAN=ON"]

[[tool.scikit-build.overrides]]
if.env.MEW_TSAN = "1"
build-dir = "build/tsan"
cmake.build-type = "Debug"
cmake.args = ["-DMEW_TSAN=ON"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "SIM"]
ignore = ["SIM108"]

[tool.ruff.lint.isort]
# Merge `from x import y` and `from x import z as z` into one statement
# instead of leaving the aliased form on its own line.
combine-as-imports = true

[tool.ty.src]
include = ["src", "tests"]
