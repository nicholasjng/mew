[build-system]
requires = ["scikit-build-core >=1.0,<2", "nanobind >=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "mew-bench"
dynamic = ["version"]
description = "A CLI for microbenchmarking Python code snippets."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Nicholas Junge", email = "nicho.junge@gmail.com" }]
dependencies = []
keywords = [
    "benchmark",
    "benchmarking",
    "microbenchmark",
    "performance",
    "google-benchmark",
    "profiling",
    "nanobind",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading :: 2 - Beta",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Benchmark",
    "Typing :: Typed",
]

[project.urls]
Documentation = "https://mew.readthedocs.io"
Repository = "https://github.com/nicholasjng/mew"
Issues = "https://github.com/nicholasjng/mew/issues"
Changelog = "https://mew.readthedocs.io/en/latest/changelog.html"

[project.optional-dependencies]
cpu = [ "pyinstrument >=4.6" ]
memory = [ "memray>=1.5; sys_platform != 'win32'" ]

[dependency-groups]
build = [
    "nanobind>=2.13.0",
    "ruff>=0.15.12",  # for CMake's post-build stub formatting step.
    "scikit-build-core >=1.0,<2",  # keep in sync with build-system.requires.
]
docs = [
    "sphinx >=8",
    "furo >=2024.8",
    "myst-parser >=4",
    "sphinx-design >=0.6",
    "sphinx-copybutton >=0.5",
    "sphinx-autodoc-typehints >=2.4",
]
test = [
    "duckdb >=1.1",
    "numpy>=2.4.6",
    "pytest >=8",
    "pytest-xdist>=3.8.0",
]
# Single source of truth for the ty version: CI, the CLI, and Zed's language
# server all resolve ty from the project .venv.
typing = [
    "ty>=0.0.42",
]

[tool.uv]
default-groups = ["build", "typing"]
# Build against the project .venv so includes from Python packages
# (nanobind etc.) in compile_commands.json survive across rebuilds.
no-build-isolation-package = ["mew-bench"]
# exclude dependency versions newer than one week
exclude-newer = "1 week"
# ...except the toolchain, which we want at the latest release: ruff and ty are
# dev tools whose diagnostics we track upstream, and nanobind is pinned in
# lockstep with the C++ bindings it generates.
exclude-newer-package = { ruff = false, ty = false, nanobind = false }

[project.scripts]
mew = "mew.cli:main"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/mew"]
wheel.py-api = "cp312"
cmake.version = ">=3.21"
cmake.build-type = "Release"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "src/mew/__init__.py"

[tool.scikit-build.cmake.define]
BENCHMARK_ENABLE_TESTING = "OFF"
BENCHMARK_ENABLE_GTEST_TESTS = "OFF"
BENCHMARK_ENABLE_INSTALL = "OFF"
CMAKE_EXPORT_COMPILE_COMMANDS = "ON"

[[tool.scikit-build.overrides]]
if.python-version = "<3.12"
wheel.py-api = ""

[[tool.scikit-build.overrides]]
# Free-threaded interpreters can't use the stable ABI.
if.abi-flags = "t"
wheel.py-api = ""

[[tool.scikit-build.overrides]]
if.env.MEW_ASAN = "1"
build-dir = "build/asan"
cmake.build-type = "Debug"
cmake.args = ["-DMEW_ASAN=ON"]

[[tool.scikit-build.overrides]]
if.env.MEW_TSAN = "1"
build-dir = "build/tsan"
cmake.build-type = "Debug"
cmake.args = ["-DMEW_TSAN=ON"]

[tool.cibuildwheel]
build = ["cp311-*", "cp312-*", "cp314t-*"]
archs = ["auto64"]
build-frontend = "build[uv]"
test-groups = ["test"]
test-command = "pytest {project}/tests -n auto"

[[tool.cibuildwheel.overrides]]
# duckdb publishes neither a free-threaded nor a musllinux wheel, so skip its installation
# to avoid a build from source. All tests using it are behind an importorskip barrier.
select = ["*t-*", "*-musllinux*"]
test-groups = []
test-requires = ["pytest >=8", "pytest-xdist>=3.8.0", "numpy>=2.4.6"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["PLW1510"]  # don't require check=False on subprocesses bound to a variable.

[tool.ruff.lint.isort]
# Merge `from x import y` and `from x import z as z` into one statement
# instead of leaving the aliased form on its own line.
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"src/mew/cpu.py" = ["BLE001"]  # broad except, necessary as we profile arbitrary functions.
"src/mew/memory.py" = ["BLE001"]
"tests/*.py" = ["C408"]  # allow dict(...) literals.

[tool.ty.src]
include = ["src", "tests"]
