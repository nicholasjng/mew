# Read the Docs configuration for mew.
# https://docs.readthedocs.com/platform/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  apt_packages:
    - cmake
    - ninja-build
  jobs:
    post_create_environment:
      - pip install uv
    install:
      # `uv sync` builds the C++ extension via scikit-build-core so autodoc
      # can import the real `mew._core`. The `docs` extra pins Sphinx + theme
      # + plugins. UV_PROJECT_ENVIRONMENT points uv at the venv RTD will run
      # `sphinx-build` from, instead of creating a project-local `.venv`.
      # `mew` itself is built with no-build-isolation (see [tool.uv] in
      # pyproject.toml), so the build backend has to be present in the target
      # env first — preinstall scikit-build-core + nanobind before syncing.
      - UV_PROJECT_ENVIRONMENT=$READTHEDOCS_VIRTUALENV_PATH uv pip install "scikit-build-core>=0.10" "nanobind>=2.2"
      - UV_PROJECT_ENVIRONMENT=$READTHEDOCS_VIRTUALENV_PATH uv sync --extra docs

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

formats:
  - htmlzip
